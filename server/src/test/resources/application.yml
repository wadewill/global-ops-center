spring:
  datasource:
    url: jdbc:h2:mem:listingscore;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      repositories:
        enabled: false
listingscore:
  redis:
    enabled: false
  security:
    jwt-secret: test-only-secret-that-is-long-enough-for-hmac-signing-2026
    credential-key: test-only-credential-encryption-key-2026
    token-ttl-hours: 12
